<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1418"/>
      <stop offset="55%" stop-color="#132a33"/>
      <stop offset="100%" stop-color="#1d4252"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .t{font:800 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:1px}
    .d{font:500 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#cbd5e1;letter-spacing:.5px}
    .s{font:600 15px 'Consolas','Courier New',monospace;fill:#38bdf8;letter-spacing:3px}
    .g1{animation:float 7s ease-in-out infinite}
    .g2{animation:float 9s ease-in-out infinite reverse}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(0,-14px)}}
    .cur{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>
  <circle class="g1" cx="140" cy="70" r="150" fill="url(#glow)"/>
  <circle class="g2" cx="880" cy="200" r="170" fill="url(#glow)"/>
  <text x="500" y="72" text-anchor="middle" class="s">// CO-FOUNDER · UNDERCRAFT STUDIO</text>
  <text x="500" y="148" text-anchor="middle" class="t" fill="url(#txt)">Abdul Rehman</text>
  <text x="500" y="192" text-anchor="middle" class="d">AI Web Developer &amp; Agentic AI Engineer</text>
  <text x="500" y="226" text-anchor="middle" class="s">NEXT.JS 16 · AI AGENTS · SAAS · E-COMMERCE<tspan class="cur"> _</tspan></text>
</svg>
